name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: No secret files tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..*)?|data/.*)$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Secret files are tracked; remove them and rotate the secrets." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
